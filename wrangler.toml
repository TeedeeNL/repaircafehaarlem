# Instellingen voor Cloudflare Workers, het platform waarop de site draait. Wrangler (de Cloudflare-opdrachtregel)
# leest dit bestand bij npm run dev, bij de build en bij het deployen. Het zegt: hoe heet de Worker, welke
# database hoort erbij en welke instellingen heeft de code nodig. Geheimen staan hier niet.
name = "repaircafehaarlem"
# De ingang van de Worker: de code uit de Astro-adapter die elk verzoek aanneemt.
main = "@astrojs/cloudflare/entrypoints/server"
# Datum waarmee we het gedrag van de Workers-runtime vastzetten, zodat een update de site niet stilletjes verandert.
compatibility_date = "2026-09-26"

# [vars] zijn gewone instellingen, zichtbaar in de repository. Geheimen horen hier NIET (zie hieronder).
# De code leest ze via env.<NAAM> (bijvoorbeeld in lib/turnstile.ts en lib/mail/index.ts).
[vars]
# Turnstile-widget "Repair Cafe Haarlem - aanmelden" (secret: TURNSTILE_SECRET_KEY op de Worker).
# Lokaal overschrijft .dev.vars dit met de publieke testsleutel.
TURNSTILE_SITE_KEY = "0x4AAAAAAFI9uyD4KOXaC8Lq"
# Hostnames waarop een token geldig is (komma-gescheiden). Nooit localhost in productie.
TURNSTILE_HOSTNAMES = "repaircafehaarlem.timduinker10.workers.dev"
# brevo = via Brevo (secret BREVO_API_KEY), eusend = bevestigingsmail via EUSEND (secret EUSEND_API_KEY), console = naar de log, uit = mail mislukt.
# Mislukte mail laat de aanmelding altijd staan (S3 toont "mail volgt later").
MAIL_MODUS = "brevo"
# Afzender op een bij Brevo geverifieerd (sub)domein. De site zelf draait op workers.dev (schoolproject,
# geen eigen domein); voor mail gebruiken we een subdomein van timwebsites.nl.
MAIL_AFZENDER = "Repair Cafe Haarlem <aanmelding@mail.timwebsites.nl>"

# Geheimen (TURNSTILE_SECRET_KEY en BREVO_API_KEY) zijn bewust niet in dit bestand gezet.
# Ze staan als "secret" op de Worker (wrangler secret put) en lokaal in .dev.vars, dat niet in git komt.
# Een site key mag publiek zijn (de browser heeft hem nodig). Een secret key mag dat nooit.

# D1 is de SQL-database van Cloudflare (SQLite). [[d1_databases]] met dubbele haken betekent: een lijst
# waarvan dit één item is. De "binding" is de naam waaronder de code erbij kan: env.DB (zie src/lib/db/client.ts).
[[d1_databases]]
binding = "DB"
database_name = "repair-cafe"
# Productie-D1 (EU-jurisdictie), aangemaakt met: wrangler d1 create repair-cafe --jurisdiction eu
database_id = "55b14bab-7ad6-4350-b28f-d458484e0eed"
migrations_dir = "migrations"
# Alleen genummerde bestanden zijn migraties; seed.sql wordt nooit automatisch uitgevoerd.
migrations_pattern = "migrations/[0-9][0-9][0-9][0-9]_*.sql"
