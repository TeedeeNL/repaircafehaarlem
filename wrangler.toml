name = "repair-cafe-haarlem"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-09-26"

[vars]
# Officiële Turnstile-testsleutel (slaagt altijd). Vervang in productie via het dashboard.
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
# eusend = bevestigingsmail via EUSEND (secret EUSEND_API_KEY), console = naar de log, uit = mail mislukt.
# Mislukte mail laat de aanmelding altijd staan (S3 toont "mail volgt later").
MAIL_MODUS = "eusend"
# Afzender op een bij EUSEND geverifieerd domein, bijv. "Repair Cafe Haarlem <aanmelding@send.jouwdomein.nl>".
# Leeg = versturen mislukt met "MAIL_AFZENDER ontbreekt" in de log.
MAIL_AFZENDER = ""

[[d1_databases]]
binding = "DB"
database_name = "repair-cafe"
# Productie-D1 (EU-jurisdictie), aangemaakt met: wrangler d1 create repair-cafe --jurisdiction eu
database_id = "55b14bab-7ad6-4350-b28f-d458484e0eed"
migrations_dir = "migrations"
# Alleen genummerde bestanden zijn migraties; seed.sql wordt nooit automatisch uitgevoerd.
migrations_pattern = "migrations/[0-9][0-9][0-9][0-9]_*.sql"
